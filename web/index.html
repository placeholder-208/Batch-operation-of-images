<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZXing WASM Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-top: 0;
        }

        .drop-zone {
            margin-bottom: 20px;
            padding: 24px 20px;
            border: 2px dashed #c9cfd8;
            border-radius: 12px;
            background: white;
            text-align: center;
            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .drop-zone.drag-over {
            border-color: #1677ff;
            background: #f0f7ff;
        }

        .drop-zone-text {
            margin-bottom: 16px;
            font-size: 15px;
            color: #444;
        }

        .drop-zone-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .drop-zone-hint {
            font-size: 13px;
            color: #777;
        }

        .action-button {
            min-height: 38px;
            padding: 0 18px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            background: white;
            color: #222;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .action-button:hover:not(:disabled) {
            background: #f5f5f5;
        }

        .action-button:disabled {
            color: #aaa;
            cursor: not-allowed;
        }

        .action-button.primary {
            border-color: #1677ff;
            background: #1677ff;
            color: white;
        }

        .action-button.primary:hover:not(:disabled) {
            background: #0958d9;
        }

        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .notice {
            margin-bottom: 20px;
            padding: 10px 14px;
            border: 1px solid #ffe1a8;
            border-radius: 8px;
            background: #fff8e6;
            color: #7a5b00;
            font-size: 14px;
        }

        .result-warning {
            margin-top: 12px;
            padding: 12px 14px;
            border: 1px solid #ffe1a8;
            border-radius: 8px;
            background: #fff8e6;
            color: #7a5b00;
            font-size: 14px;
            line-height: 1.6;
        }

        .result-error {
            margin-top: 12px;
            padding: 12px 14px;
            border: 1px solid #ffccc7;
            border-radius: 8px;
            background: #fff1f0;
            color: #a8071a;
            font-size: 14px;
            line-height: 1.6;
        }

        .empty-state {
            padding: 20px 22px;
            border: 1px solid #ffe1a8;
            border-radius: 12px;
            background: #fff8e6;
            color: #7a5b00;
        }

        .empty-state h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .empty-state ul {
            margin: 8px 0 0;
            padding-left: 20px;
            line-height: 1.7;
        }

        .result {
            margin-bottom: 30px;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            line-height: 0;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .source-image {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .qr-marker {
            position: absolute;
            transform: translate(-50%, -50%);

            width: 30px;
            height: 30px;
            padding: 0;
            margin: 0;

            border: 2px solid white;
            border-radius: 50%;

            background: rgba(22, 119, 255, 0.90);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: 600;
            line-height: 1;

            text-align: center;
            cursor: pointer;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);

            z-index: 10;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;
        }

        .qr-marker:hover {
            background: rgba(9, 88, 217, 0.95);
            transform: translate(-50%, -50%) scale(1.12);
        }

        #output {
            white-space: pre-wrap;
            margin-top: 20px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            width: min(700px, 100%);
            max-height: min(80vh, 700px);
            overflow: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            padding: 24px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .modal-close {
            border: none;
            background: transparent;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            color: #666;
        }

        .modal-meta {
            margin-bottom: 16px;
            color: #555;
            font-size: 14px;
        }

        .modal-content {
            margin: 0;
            padding: 14px;
            background: #f6f6f6;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            font-family: inherit;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .modal-actions button,
        .modal-actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 16px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            background: white;
            color: #222;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-actions button:hover,
        .modal-actions a:hover {
            background: #f5f5f5;
        }

        .modal-actions .primary {
            border-color: #1677ff;
            background: #1677ff;
            color: white;
        }

        .modal-actions .primary:hover {
            background: #0958d9;
        }

        #progress {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        #progressText {
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e5e5;
            border-radius: 4px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #1677ff;
            transition: width 0.2s ease;
        }
    </style>
</head>

<body>

    <h1>ZXing WASM Test</h1>

    <div id="dropZone" class="drop-zone">
        <div class="drop-zone-text">
            把图片拖到这里，或者使用下面的方式添加
        </div>

        <div class="drop-zone-actions">
            <button
                id="pickFilesButton"
                type="button"
                class="action-button primary"
            >
                选择图片
            </button>

            <button
                id="pickFolderButton"
                type="button"
                class="action-button"
            >
                选择文件夹
            </button>

            <button
                id="clearButton"
                type="button"
                class="action-button"
                disabled
            >
                清空 / 重新开始
            </button>
        </div>

        <div class="drop-zone-hint">
            支持拖入图片或整个文件夹，也可以按 Ctrl + V
            粘贴剪贴板里的图片；重复选择会累加，需要重新开始时点「清空」
        </div>
    </div>

    <input
        id="fileInput"
        type="file"
        accept="image/*"
        multiple
        hidden
    >

    <input
        id="folderInput"
        type="file"
        webkitdirectory
        multiple
        hidden
    >

    <div class="toolbar">
        <label>
            <input id="zipOutput" type="checkbox">
            输出切割后图片 ZIP
        </label>

        <button id="downloadAllZip" type="button" disabled>
            下载全部裁剪结果 ZIP
        </button>
    </div>

    <div id="notice" class="notice" hidden></div>

    <div id="results"></div>

    <div id="progress">
        <div id="progressText">等待图片...</div>

        <div class="progress-bar">
            <div id="progressBar"></div>
        </div>
    </div>

    <div id="qrModalBackdrop" class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 id="qrModalTitle">二维码</h2>
                <button id="qrModalClose" class="modal-close" type="button">&times;</button>
            </div>

            <div id="qrModalMeta" class="modal-meta"></div>

            <pre id="qrModalContent" class="modal-content"></pre>

            <div id="qrModalActions" class="modal-actions"></div>
        </div>
    </div>

    <script src="./zxing/index.js"></script>
    <script src="./jszip.min.js"></script>
    <script type="module" src="./app.js"></script>

</body>
</html>
